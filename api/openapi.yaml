    get:
      tags: [summaries]
      operationId: getMonthlySummary
      summary: Monthly summary (landing view)
      description: |
        Every income source and category is listed, zero-filled, in `sort_order`, so the layout is
        stable month to month. Clients compute tax rate, percent of income and the previous-month comparison.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlySummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/summaries/yearly/{year}:
    parameters:
      - $ref: '#/components/parameters/YearPath'
    get:
      tags: [summaries]
      operationId: getYearlySummary
      summary: Yearly summary
      description: All twelve months are returned, zero-filled. Tapping a month opens `/v1/summaries/monthly/{month}`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearlySummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------------------
  # Trends
  # ---------------------------------------------------------------------------
  /v1/trends/custom:
    get:
      tags: [trends]
      operationId: getCustomTrend
      summary: Custom trend
      description: |
        Filters combine with AND; at least one of `category_id`, `merchant_id`, `text` is required.
        Every period in the range is returned, zero-filled. Both measures are returned; the client
        charts whichever the user picked.

        `total_cents` is net of refunds. `count` counts expenses only (refunds are not transactions).
      parameters:
        - name: category_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: merchant_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: text
          in: query
          description: Case-insensitive substring match on the expense note.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Date' }
        - name: to
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Date' }
        - name: group_by
          in: query
          schema:
            type: string
            enum: [month, year]
            default: month
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomTrend' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/trends/by-category:
    get:
      tags: [trends]
      operationId: getCategoryTrends
      summary: Monthly totals per category, this year and last
      description: |
        Returns 12 monthly totals for `year` and 12 for `year - 1`, for every category plus an
        "all spending" series. That covers month-over-month (January vs. last year's December),
        year-over-year, year-to-date and the biggest-movers ranking; clients compute those.
      parameters:
        - name: year
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Year' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryTrends' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------------------
  # Saved trends
  # ---------------------------------------------------------------------------
  /v1/saved-trends:
    get:
      tags: [saved-trends]
      operationId: listSavedTrends
      summary: List saved trends
      description: Sorted by `sort_order`. Not paginated.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SavedTrend' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [saved-trends]
      operationId: createSavedTrend
      summary: Save a trend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedTrendCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedTrend' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/saved-trends/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [saved-trends]
      operationId: getSavedTrend
      summary: Get a saved trend
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedTrend' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [saved-trends]
      operationId: updateSavedTrend
      summary: Edit a saved trend
      description: Changing `match_type` requires sending the matching field for the new type.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedTrendUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedTrend' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [saved-trends]
      operationId: deleteSavedTrend
      summary: Delete a saved trend
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Admin (admins only)
  # ---------------------------------------------------------------------------
  /v1/admin/status:
    get:
      tags: [admin]
      operationId: getAdminStatus
      summary: App status for the admin panel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/backups:
    get:
      tags: [admin]
      operationId: listBackups
      summary: List backup snapshots
      description: Newest first. Includes failed and running backups.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Backup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: startBackup
      summary: Back up now
      description: Starts a manual backup and returns immediately. Poll the list for its status.
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/backups/{id}/download:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [admin]
      operationId: downloadBackup
      summary: Download an encrypted snapshot
      description: Returns the encrypted archive only, never decrypted data. `409 backup_not_ready` unless the backup succeeded.
      responses:
        '200':
          description: The encrypted archive.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="penny-pincher-2026-10-25-weekly.enc"
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: List the app's users
      description: Account details only, oldest first. Never any entries, amounts or counts of them.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: addUser
      summary: Add a user to the database
      description: |
        Adds the Firebase uid to the users table (the allowlist) and seeds the default categories,
        the "Other" income source and an empty template. Database only: the Firebase account must
        already exist, and Firebase is never called. `409 user_exists` for a uid already added.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewAdminUser' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------------------
  # Import (multi-year Excel import; built with export, last in v1)
  # ---------------------------------------------------------------------------
  /v1/imports/template:
    get:
      tags: [imports]
      operationId: downloadImportTemplate
      summary: Download the Excel import template
      description: |
        An `.xlsx` workbook built for the signed-in user:

        - **Expenses** sheet: `Date`, `Category`, `Merchant`, `Amount`, `Note`.
        - **Income** sheet: `Date`, `Source`, `Gross`, `Gross taxable`, `Net`, `Note`.

        `Category` and `Source` are dropdowns (data validation) filled with the user's current
        categories and income sources. Amounts in the file are **dollars** with at most two
        decimals; the server converts them to integer cents. Refunds are negative amounts.
        The data sheets start empty below the header row. A third sheet, **How to fill this in**,
        shows example rows and the rules; it is ignored on upload.
      responses:
        '200':
          description: The template workbook.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="penny-pincher-import.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/imports:
    get:
      tags: [imports]
      operationId: listImports
      summary: Import history
      description: |
        Newest first. Filter by `status=running` to find an import in progress (the app-wide
        progress banner does this on load). Imports still in `review` are included.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ImportStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ImportSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [imports]
      operationId: uploadImport
      summary: Upload a filled-out template and check it
      description: |
        Parses and checks **every row** and returns the import in status `review`.
        **Nothing is saved to expenses or income entries yet**; call `startImport` to do that.

        - Max file size **10 MB** (`413 file_too_large`) and **50,000 rows** across both sheets.
        - Not an `.xlsx`, missing an `Expenses` or `Income` sheet, or changed column headers:
          `400 invalid_import_file`. A file with no data rows: `400 invalid_import_file`.
        - Rows with problems are listed in `issues` and are skipped if the import is started.
          Categories and sources are matched by name, case-insensitively; unknown names are
          problems (never created automatically). Merchants are matched or created, as on
          `createExpense`.
        - Months in the file that already have entries in the app are listed in
          `months_with_existing_entries`. Imported entries are **added alongside** them.
        - An import left in `review` expires after 24 hours (status `expired`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                  description: The filled-out template. Its file name is kept for the history list.
      responses:
        '201':
          description: Checked; waiting for the user to review and start it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Import' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/imports/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [imports]
      operationId: getImport
      summary: One import, with its check results and progress
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Import' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [imports]
      operationId: discardImport
      summary: Discard an import that was never started
      description: |
        Only for status `review` (the user chose a different file). Removes the checked rows.
        Any other status: `409 import_wrong_status`; use `cancelImport` or `undoImport` instead.
      responses:
        '204': { description: Discarded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/imports/{id}/problems:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [imports]
      operationId: downloadImportProblems
      summary: Download the rows that have problems
      description: |
        An `.xlsx` in the template's layout holding only the rows listed in `issues`, with their
        original values and an extra `Problem` column. The user can fix it and upload it as a new
        import. Used for "Download file with problems marked" before starting and "Download
        skipped rows" after finishing. Available in any status; empty sheets if there were none.
      responses:
        '200':
          description: The problem rows.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="my-history-problems.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/imports/{id}/start:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [imports]
      operationId: startImport
      summary: Start importing the rows that passed the check
      description: |
        Moves the import from `review` to `running` and returns at once (`202`). The server writes
        the ready rows in the background, in batches, oldest month first. Follow progress with
        `streamImportEvents` (or poll `getImport`).

        - Imported entries are `confirmed` and carry this import's id (`import_id`).
        - Entries appear in reads as their batch is written.
        - If the server stops before the import finishes, on the next start-up the import is
          marked `failed` and every entry it wrote is removed, so nothing from the file stays.
        - Only one import per user may be `running`: `409 import_in_progress`.
        - Any status other than `review`: `409 import_wrong_status`.
      responses:
        '202':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Import' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/imports/{id}/events:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [imports]
      operationId: streamImportEvents
      summary: Live progress (Server-Sent Events)
      description: |
        A `text/event-stream`. Requires the usual bearer token, so web clients read it with
        `fetch` and a stream reader (the browser's `EventSource` cannot send headers); the Mac app
        uses `URLSession` bytes.

        Events:

        - `progress`: data is an `ImportProgress` JSON object. Sent right after connecting, then
          after each written batch (at most a few per second).
        - `finished`: data is the final `Import` JSON object (status `completed`, `cancelled` or
          `failed`). The server then closes the stream.
        - A comment line (`: ping`) every 15 seconds keeps proxies from closing an idle stream.

        For an import that is not `running`, the server sends one `finished` event and closes.
        Clients reconnect if the stream drops before `finished`, and refetch `getImport`.
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events. Example:

                      event: progress
                      data: {"status":"running","rows_done":2275,"rows_total":4946,"current_month":"2024-03","eta_seconds":67}

                      event: finished
                      data: {"id":"7","status":"completed", ...}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/imports/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [imports]
      operationId: cancelImport
      summary: Cancel a running import and remove what it added
      description: |
        Stops the import after its current batch and deletes **every** entry it wrote, in one
        transaction, then sets status `cancelled`. Returns once the rollback is done.
        Not `running`: `409 import_wrong_status`.
      responses:
        '200':
          description: Cancelled and rolled back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Import' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/imports/{id}/undo:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [imports]
      operationId: undoImport
      summary: Undo a finished import as one batch
      description: |
        Deletes every expense and income entry that still carries this import's id, **including
        ones the user edited after importing**, in one transaction, and sets status `undone`.
        Entries the user added by hand are never touched. A manual refund linked to a deleted
        expense is unlinked, not deleted (as when deleting any expense).
        Not `completed`: `409 import_wrong_status`.
      responses:
        '200':
          description: Undone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Import' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------------------
  # Export (built last in v1)
  # ---------------------------------------------------------------------------
  /v1/export:
    get:
      tags: [export]
      operationId: exportData
      summary: Export expenses and income
      description: |
        **Built last in v1; shape may change before then.**

        - `xlsx`: one workbook with an Expenses sheet and an Income sheet.
        - `csv`: a zip holding `expenses.csv` and `income.csv`.

        Amounts are integer cents, as everywhere else. With no range, exports everything.

        Each amount is a numeric `(cents)` column; a separate `(formatted dollars)` column is text for
        reading only. Refunds are negative. User-entered text that starts with `=`, `+`, `-` or `@` is
        prefixed with `'` so spreadsheets don't run it as a formula. Only the caller's own rows are
        exported. `from` after `to` is `400 invalid_request`.
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, xlsx]
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
      responses:
        '200':
          description: The export file.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, contentMediaType: application/zip }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

# =============================================================================
components:
  securitySchemes:
    firebase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Firebase Authentication ID token. The backend verifies it on every request, then requires
        the Firebase uid to exist in its own users table (the allowlist).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    MonthPath:
      name: month
      in: path
      required: true
      schema: { $ref: '#/components/schemas/YearMonth' }
    YearPath:
      name: year
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Year' }
    YearQuery:
      name: year
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Year' }
    MonthQuery:
      name: month
      in: query
      description: Only entries dated in this month. Cannot be combined with `from`/`to`.
      schema: { $ref: '#/components/schemas/YearMonth' }
    FromQuery:
      name: from
      in: query
      description: Inclusive start date.
      schema: { $ref: '#/components/schemas/Date' }
    ToQuery:
      name: to
      in: query
      description: Inclusive end date.
      schema: { $ref: '#/components/schemas/Date' }
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` from the previous page.
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed JSON or a value that fails validation (`invalid_request`, `invalid_refund_link`, `invalid_import_file`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: invalid_request
              message: gross_taxable_cents cannot exceed gross_cents
              details:
                - field: gross_taxable_cents
                  issue: must be <= gross_cents
    Unauthorized:
      description: |
        Missing, expired, invalid or revoked token (`unauthenticated`), or a sign-in more than
        30 days old (`session_expired`). Either way the client signs the user out.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        `not_allowlisted` (valid token, but no local user row) or `admin_required` (member on an admin route).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: |
        The request body is over the size limit: `file_too_large` on the import upload,
        `request_too_large` anywhere else. Any route can return it (see Limits above).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: |
        Rate limited (`rate_limited`). Wait for `Retry-After` seconds before trying again.
        Any route can return it (see Limits above); expensive routes have a tighter limit.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: rate_limited
              message: Too many requests. Try again in a moment.
    NotFound:
      description: No such resource for this user (`not_found`). Another user's rows are also reported as not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |
        A business rule blocked the request. Codes: `protected_resource`, `source_has_entries`,
        `name_taken`, `has_linked_refunds`, `month_not_empty`, `backup_in_progress`, `backup_not_ready`,
        `import_in_progress`, `import_wrong_status`, `user_exists`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: source_has_entries
              message: This income source has income entries and cannot be deleted. Rename it instead.

  schemas:
    # ---- Primitives ---------------------------------------------------------
    Id:
      type: string
      description: Opaque identifier.
      examples: ['42']
    Cents:
      type: integer
      format: int64
      description: Integer cents. `$12.34` is `1234`.
    NonNegativeCents:
      type: integer
      format: int64
      minimum: 0
    Date:
      type: string
      format: date
      description: Calendar date, `YYYY-MM-DD`, no time zone.
      examples: ['2026-10-30']
    YearMonth:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      examples: ['2026-10']
    Year:
      type: integer
      minimum: 2000
      maximum: 2100
    Timestamp:
      type: string
      format: date-time
      readOnly: true
    Name:
      type: string
      minLength: 1
      maxLength: 100
      description: Trimmed; unique per user, case-insensitively, within its kind.
    Note:
      type: [string, 'null']
      maxLength: 500
    Color:
      type: [string, 'null']
      pattern: '^#[0-9A-Fa-f]{6}$'
      examples: ['#2F80ED']
    DayOfMonth:
      type: integer
      minimum: 1
      maximum: 31
      description: 29, 30 or 31 are clamped to the last day of shorter months when applied.
    NextCursor:
      type: [string, 'null']
      description: Pass as `cursor` to get the next page; null on the last page.
    ReorderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }

    # ---- Errors -------------------------------------------------------------
    # ---- Imports -------------------------------------------------------------
    ImportStatus:
      type: string
      description: |
        `review` (checked, nothing saved) → `running` → `completed` | `cancelled` | `failed`;
        `completed` → `undone`. A `review` import not started within 24 hours becomes `expired`.
        `cancelled`, `failed` and `undone` imports have no entries left in the app.
      enum: [review, running, completed, cancelled, failed, undone, expired]
    ImportSheet:
      type: string
      enum: [expenses, income]
    ImportSummary:
      type: object
      description: One row of the import history.
      required:
        - id
        - file_name
        - status
        - created_at
        - finished_at
        - first_month
        - last_month
        - rows_ready
        - rows_with_problems
        - entries_imported
      properties:
        id: { $ref: '#/components/schemas/Id' }
        file_name: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: When it completed, was cancelled, failed or was undone.
        first_month:
          type: [string, 'null']
          description: Earliest month among ready rows (`YYYY-MM`); null if none are ready.
        last_month:
          type: [string, 'null']
          description: Latest month among ready rows (`YYYY-MM`).
        rows_ready: { type: integer, minimum: 0 }
        rows_with_problems: { type: integer, minimum: 0 }
        entries_imported:
          type: integer
          minimum: 0
          description: Entries of this import currently in the app (0 once cancelled, failed or undone).
    Import:
      allOf:
        - $ref: '#/components/schemas/ImportSummary'
        - type: object
          required:
            - expense_rows
            - income_rows
            - years
            - months_with_existing_entries
            - issues
            - issues_truncated
            - failure_reason
          properties:
            expense_rows:
              type: integer
              minimum: 0
              description: Data rows found on the Expenses sheet (ready + with problems).
            income_rows:
              type: integer
              minimum: 0
              description: Data rows found on the Income sheet (ready + with problems).
            years:
              type: array
              description: Ready rows per calendar year, oldest first, for the review table.
              items: { $ref: '#/components/schemas/ImportYear' }
            months_with_existing_entries:
              type: array
              description: |
                Months in the file that already had entries in the app when it was checked.
                Imported rows are added alongside them, never replacing them.
              items:
                type: object
                required: [month, existing_entries, file_entries]
                properties:
                  month: { $ref: '#/components/schemas/YearMonth' }
                  existing_entries: { type: integer, minimum: 0 }
                  file_entries:
                    type: integer
                    minimum: 0
                    description: Ready rows in the file for this month.
            issues:
              type: array
              description: |
                Rows with problems, in sheet and row order. At most 500 are listed; the rest are in
                `downloadImportProblems`. A row may have several issues.
              items: { $ref: '#/components/schemas/ImportIssue' }
            issues_truncated:
              type: boolean
              description: True when more than 500 issues exist.
            progress:
              allOf: [{ $ref: '#/components/schemas/ImportProgress' }]
              description: Present only while `running`.
            failure_reason:
              type: [string, 'null']
              description: Safe to show. Set only when `failed` (for example, the server restarted).
    ImportYear:
      type: object
      required: [year, months, expense_rows, income_rows, spent_cents, rows_with_problems]
      properties:
        year: { $ref: '#/components/schemas/Year' }
        months:
          type: integer
          minimum: 1
          maximum: 12
          description: Months in this year that have at least one ready row.
        expense_rows: { type: integer, minimum: 0, description: Ready expense rows (refunds included). }
        income_rows: { type: integer, minimum: 0, description: Ready income rows. }
        spent_cents:
          allOf: [{ $ref: '#/components/schemas/Cents' }]
          description: Sum of ready expense amounts (refunds lower it), the same way totals count elsewhere.
        rows_with_problems: { type: integer, minimum: 0 }
    ImportIssue:
      type: object
      required: [sheet, row, column, code, value, message]
      properties:
        sheet: { $ref: '#/components/schemas/ImportSheet' }
        row:
          type: integer
          minimum: 2
          description: The Excel row number (row 1 is the header), so the user can find it.
        column:
          type: string
          description: The column header as written in the template, for example `Category`.
          examples: ['Category']
        code:
          type: string
          description: Stable; clients group and word issues by this.
          enum:
            - unknown_category
            - unknown_income_source
            - invalid_date
            - missing_value
            - invalid_number
            - too_many_decimals
            - zero_amount
            - negative_income
            - taxable_exceeds_gross
            - net_exceeds_gross
            - text_too_long
        value:
          type: string
          description: The cell's original text; empty when the cell was blank.
        message: { type: string, description: Human-readable; safe to show. }
    ImportProgress:
      type: object
      required: [status, rows_done, rows_total, current_month, eta_seconds, years]
      properties:
        status: { $ref: '#/components/schemas/ImportStatus' }
        rows_done: { type: integer, minimum: 0 }
        rows_total:
          type: integer
          minimum: 0
          description: Ready rows being imported (rows with problems are skipped).
        current_month:
          type: [string, 'null']
          description: The month (`YYYY-MM`) of the batch being written.
        eta_seconds:
          type: [integer, 'null']
          minimum: 0
          description: Estimated seconds left, from the rate so far; null until the first batch is written.
        years:
          type: array
          description: Per-year progress, oldest first.
          items:
            type: object
            required: [year, rows_done, rows_total]
            properties:
              year: { $ref: '#/components/schemas/Year' }
              rows_done: { type: integer, minimum: 0 }
              rows_total: { type: integer, minimum: 0 }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable. Clients branch on this, never on `message`.
              enum:
                - invalid_request
                - invalid_refund_link
                - unauthenticated
                - session_expired
                - not_allowlisted
                - admin_required
                - not_found
                - protected_resource
                - source_has_entries
                - name_taken
                - has_linked_refunds
                - month_not_empty
                - backup_in_progress
                - user_exists
                - backup_not_ready
                - invalid_import_file
                - file_too_large
                - import_in_progress
                - import_wrong_status
                - request_too_large
                - rate_limited
                - not_implemented
                - internal
            message:
              type: string
              description: Human-readable; safe to show. Never contains internals.
            details:
              type: array
              items:
                type: object
                required: [field, issue]
                properties:
                  field:
                    type: string
                    examples: ['items[3].amount_cents']
                  issue: { type: string }

    # ---- System / me --------------------------------------------------------
    Health:
      type: object
      required: [status, version, uptime_seconds]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          examples: ['0.1.0+9b006e3']
        uptime_seconds: { type: integer, minimum: 0 }
    Me:
      type: object
      required: [id, role]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: [string, 'null'] }
        display_name: { type: [string, 'null'] }
        role:
          type: string
          enum: [admin, member]

    # ---- Categories ---------------------------------------------------------
    Category:
      type: object
      required: [id, name, color, is_saving, is_protected, sort_order, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        color: { $ref: '#/components/schemas/Color' }
        is_saving:
          type: boolean
          description: Saving counts as an expense but is presented differently; going up is good.
        is_protected:
          type: boolean
          readOnly: true
          description: True only for "Other", which can never be renamed or deleted.
        sort_order: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    CategoryCreate:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        color: { $ref: '#/components/schemas/Color' }
        is_saving: { type: boolean, default: false }
    CategoryUpdate:
      type: object
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/Name' }
        color: { $ref: '#/components/schemas/Color' }
        is_saving: { type: boolean }

    CategoryStats:
      type: object
      required: [category_id, entry_count, total_cents, year_total_cents]
      properties:
        category_id: { $ref: '#/components/schemas/Id' }
        entry_count:
          type: integer
          minimum: 0
          description: Every expense and refund in the category, all time.
        total_cents:
          allOf: [{ $ref: '#/components/schemas/Cents' }]
          description: Sum of those amounts, all time (net of refunds). Can be negative.
        year_total_cents:
          allOf: [{ $ref: '#/components/schemas/Cents' }]
          description: Sum of amounts dated in the requested year (net of refunds). Can be negative.

    # ---- Income sources -----------------------------------------------------
    IncomeSource:
      type: object
      required: [id, name, is_protected, has_entries, sort_order, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        is_protected:
          type: boolean
          readOnly: true
        has_entries:
          type: boolean
          readOnly: true
          description: When true the source can only be renamed, never deleted. Clients hide Delete.
        sort_order: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    IncomeSourceCreate:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/Name' }
    IncomeSourceUpdate:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/Name' }

    IncomeSourceStats:
      type: object
      required: [income_source_id, entry_count, year_gross_cents, year_gross_taxable_cents, year_net_cents]
      properties:
        income_source_id: { $ref: '#/components/schemas/Id' }
        entry_count:
          type: integer
          minimum: 0
          description: Every income entry for the source, all time.
        year_gross_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        year_gross_taxable_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        year_net_cents: { $ref: '#/components/schemas/NonNegativeCents' }

    # ---- Merchants ----------------------------------------------------------
    Merchant:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }

    # ---- Expenses -----------------------------------------------------------
    ExpenseType:
      type: string
      enum: [expense, refund]
      description: Derived from the sign of `amount_cents`; refunds are negative.
    Expense:
      type: object
      required:
        - id
        - date
        - amount_cents
        - type
        - category_id
        - merchant
        - note
        - refunded_expense_id
        - refunded_total_cents
        - last_refund_date
        - confirmed
        - template_apply_id
        - import_id
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        date: { $ref: '#/components/schemas/Date' }
        amount_cents: { $ref: '#/components/schemas/Cents' }
        type:
          $ref: '#/components/schemas/ExpenseType'
          readOnly: true
        category_id: { $ref: '#/components/schemas/Id' }
        merchant: { $ref: '#/components/schemas/Merchant' }
        note: { $ref: '#/components/schemas/Note' }
        refunded_expense_id:
          type: [string, 'null']
          description: On a refund, the expense it refunds (optional).
        refunded_total_cents:
          allOf: [{ $ref: '#/components/schemas/Cents' }]
          readOnly: true
          description: |
            On an expense, the sum of linked refunds (zero or negative), computed at read time and
            never stored. Display net = `amount_cents + refunded_total_cents`. Always 0 on a refund.
        last_refund_date:
          type: [string, 'null']
          format: date
          readOnly: true
          description: |
            On an expense, the date of its latest linked refund, computed at read time and never
            stored. Null when no refund is linked, and always null on a refund.
        confirmed:
          type: boolean
          description: False for entries copied from a template that the user hasn't reviewed yet.
        template_apply_id:
          type: [string, 'null']
          readOnly: true
        import_id:
          type: [string, 'null']
          readOnly: true
          description: The import that created this entry, if any. Undoing that import deletes it.
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ExpenseCreate:
      type: object
      required: [date, amount_cents, category_id, merchant_name]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        amount_cents:
          allOf: [{ $ref: '#/components/schemas/Cents' }]
          not: { const: 0 }
          description: Non-zero. Negative means refund.
        category_id: { $ref: '#/components/schemas/Id' }
        merchant_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Matched case-insensitively to an existing merchant, or creates one.
        note: { $ref: '#/components/schemas/Note' }
        refunded_expense_id:
          type: [string, 'null']
          description: Only allowed when `amount_cents` is negative; must be a positive expense of yours.
        confirmed: { type: boolean, default: true }
    ExpenseUpdate:
      type: object
      minProperties: 1
      properties:
        date: { $ref: '#/components/schemas/Date' }
        amount_cents:
          allOf: [{ $ref: '#/components/schemas/Cents' }]
          not: { const: 0 }
        category_id: { $ref: '#/components/schemas/Id' }
        merchant_name: { type: string, minLength: 1, maxLength: 100 }
        note: { $ref: '#/components/schemas/Note' }
        refunded_expense_id: { type: [string, 'null'] }
        confirmed: { type: boolean }

    # ---- Income entries -----------------------------------------------------
    IncomeEntry:
      type: object
      required:
        - id
        - date
        - income_source_id
        - gross_cents
        - gross_taxable_cents
        - net_cents
        - note
        - confirmed
        - template_apply_id
        - import_id
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        date: { $ref: '#/components/schemas/Date' }
        income_source_id: { $ref: '#/components/schemas/Id' }
        gross_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        gross_taxable_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        net_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        note: { $ref: '#/components/schemas/Note' }
        confirmed: { type: boolean }
        template_apply_id:
          type: [string, 'null']
          readOnly: true
        import_id:
          type: [string, 'null']
          readOnly: true
          description: The import that created this entry, if any. Undoing that import deletes it.
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    IncomeEntryCreate:
      type: object
      description: '`gross_taxable_cents` and `net_cents` must each be <= `gross_cents`.'
      required: [date, income_source_id, gross_cents, gross_taxable_cents, net_cents]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        income_source_id: { $ref: '#/components/schemas/Id' }
        gross_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        gross_taxable_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        net_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        note: { $ref: '#/components/schemas/Note' }
        confirmed: { type: boolean, default: true }
    IncomeEntryUpdate:
      type: object
      minProperties: 1
      description: The resulting entry must still satisfy taxable <= gross and net <= gross.
      properties:
        date: { $ref: '#/components/schemas/Date' }
        income_source_id: { $ref: '#/components/schemas/Id' }
        gross_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        gross_taxable_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        net_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        note: { $ref: '#/components/schemas/Note' }
        confirmed: { type: boolean }

    # ---- Templates ----------------------------------------------------------
    TemplateSummary:
      type: object
      required: [id, name, expense_item_count, income_item_count, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        expense_item_count: { type: integer, minimum: 0 }
        income_item_count: { type: integer, minimum: 0 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    Template:
      type: object
      required: [id, name, expense_items, income_items, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        expense_items:
          type: array
          description: Sorted by `sort_order`.
          items: { $ref: '#/components/schemas/TemplateExpenseItem' }
        income_items:
          type: array
          description: Sorted by `sort_order`.
          items: { $ref: '#/components/schemas/TemplateIncomeItem' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    TemplateExpenseItem:
      type: object
      required: [id, category_id, merchant, day_of_month, amount_cents, note, sort_order]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        category_id: { $ref: '#/components/schemas/Id' }
        merchant: { $ref: '#/components/schemas/Merchant' }
        day_of_month: { $ref: '#/components/schemas/DayOfMonth' }
        amount_cents:
          type: integer
          format: int64
          minimum: 1
        note: { $ref: '#/components/schemas/Note' }
        sort_order: { type: integer }
    TemplateExpenseItemCreate:
      type: object
      required: [category_id, merchant_name, day_of_month, amount_cents]
      properties:
        category_id: { $ref: '#/components/schemas/Id' }
        merchant_name: { type: string, minLength: 1, maxLength: 100 }
        day_of_month: { $ref: '#/components/schemas/DayOfMonth' }
        amount_cents:
          type: integer
          format: int64
          minimum: 1
        note: { $ref: '#/components/schemas/Note' }
        sort_order:
          type: integer
          description: Defaults to the end of the list.
    TemplateExpenseItemUpdate:
      type: object
      minProperties: 1
      properties:
        category_id: { $ref: '#/components/schemas/Id' }
        merchant_name: { type: string, minLength: 1, maxLength: 100 }
        day_of_month: { $ref: '#/components/schemas/DayOfMonth' }
        amount_cents:
          type: integer
          format: int64
          minimum: 1
        note: { $ref: '#/components/schemas/Note' }
        sort_order: { type: integer }
    TemplateIncomeItem:
      type: object
      required: [id, income_source_id, day_of_month, gross_cents, gross_taxable_cents, net_cents, note, sort_order]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        income_source_id: { $ref: '#/components/schemas/Id' }
        day_of_month: { $ref: '#/components/schemas/DayOfMonth' }
        gross_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        gross_taxable_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        net_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        note: { $ref: '#/components/schemas/Note' }
        sort_order: { type: integer }
    TemplateIncomeItemCreate:
      type: object
      description: '`gross_taxable_cents` and `net_cents` must each be <= `gross_cents`.'
      required: [income_source_id, day_of_month, gross_cents, gross_taxable_cents, net_cents]
      properties:
        income_source_id: { $ref: '#/components/schemas/Id' }
        day_of_month: { $ref: '#/components/schemas/DayOfMonth' }
        gross_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        gross_taxable_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        net_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        note: { $ref: '#/components/schemas/Note' }
        sort_order: { type: integer }
    TemplateIncomeItemUpdate:
      type: object
      minProperties: 1
      properties:
        income_source_id: { $ref: '#/components/schemas/Id' }
        day_of_month: { $ref: '#/components/schemas/DayOfMonth' }
        gross_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        gross_taxable_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        net_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        note: { $ref: '#/components/schemas/Note' }
        sort_order: { type: integer }
    TemplateApply:
      type: object
      required:
        - id
        - template_id
        - template_name
        - month
        - applied_at
        - created_expense_count
        - created_income_entry_count
        - unconfirmed_count
      properties:
        id: { $ref: '#/components/schemas/Id' }
        template_id:
          type: [string, 'null']
          description: Null if the template was deleted since.
        template_name:
          type: [string, 'null']
        month: { $ref: '#/components/schemas/YearMonth' }
        applied_at: { $ref: '#/components/schemas/Timestamp' }
        created_expense_count: { type: integer, minimum: 0, readOnly: true }
        created_income_entry_count: { type: integer, minimum: 0, readOnly: true }
        unconfirmed_count:
          type: integer
          minimum: 0
          readOnly: true
          description: Entries from this apply still unconfirmed, i.e. what Undo would remove. Hide Undo at 0.
    TemplateApplyResult:
      allOf:
        - $ref: '#/components/schemas/TemplateApply'
        - type: object
          required: [removed_expense_count, removed_income_entry_count]
          properties:
            removed_expense_count:
              type: integer
              minimum: 0
              description: Expenses deleted by `reset_month` (0 when the month was empty).
            removed_income_entry_count:
              type: integer
              minimum: 0
              description: Income entries deleted by `reset_month` (0 when the month was empty).

    # ---- Summaries ----------------------------------------------------------
    IncomeTotals:
      type: object
      required: [gross_cents, gross_taxable_cents, net_cents, entry_count]
      properties:
        gross_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        gross_taxable_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        net_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        entry_count: { type: integer, minimum: 0 }
    MonthlySummary:
      type: object
      required: [month, income, spending, left_over_cents, unconfirmed, template_applies, is_empty]
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        income:
          type: object
          required: [sources, combined]
          properties:
            sources:
              type: array
              description: Every income source, zero-filled, in `sort_order`.
              items:
                allOf:
                  - $ref: '#/components/schemas/IncomeTotals'
                  - type: object
                    required: [income_source_id, name, is_protected]
                    properties:
                      income_source_id: { $ref: '#/components/schemas/Id' }
                      name: { type: string }
                      is_protected: { type: boolean }
            combined:
              $ref: '#/components/schemas/IncomeTotals'
              description: All sources combined.
        spending:
          type: object
          required: [categories, total_cents, saving_cents, previous_month_total_cents]
          properties:
            categories:
              type: array
              description: Every category, zero-filled, in `sort_order`.
              items:
                type: object
                required:
                  - category_id
                  - name
                  - color
                  - is_saving
                  - is_protected
                  - total_cents
                  - expense_count
                  - refund_count
                  - previous_month_total_cents
                properties:
                  category_id: { $ref: '#/components/schemas/Id' }
                  name: { type: string }
                  color: { $ref: '#/components/schemas/Color' }
                  is_saving: { type: boolean }
                  is_protected: { type: boolean }
                  total_cents:
                    allOf: [{ $ref: '#/components/schemas/Cents' }]
                    description: Net of refunds logged this month. Can be negative.
                  expense_count: { type: integer, minimum: 0 }
                  refund_count: { type: integer, minimum: 0 }
                  previous_month_total_cents: { $ref: '#/components/schemas/Cents' }
            total_cents:
              allOf: [{ $ref: '#/components/schemas/Cents' }]
              description: All spending, Saving included.
            saving_cents:
              allOf: [{ $ref: '#/components/schemas/Cents' }]
              description: The Saving part of `total_cents`, broken out.
            previous_month_total_cents: { $ref: '#/components/schemas/Cents' }
        left_over_cents:
          allOf: [{ $ref: '#/components/schemas/Cents' }]
          description: '`income.combined.net_cents - spending.total_cents`. Can be negative.'
        unconfirmed:
          type: object
          required: [expense_count, income_entry_count]
          properties:
            expense_count: { type: integer, minimum: 0 }
            income_entry_count: { type: integer, minimum: 0 }
        template_applies:
          type: array
          description: Applies for this month, newest first (to offer Undo).
          items: { $ref: '#/components/schemas/TemplateApply' }
        is_empty:
          type: boolean
          description: No expenses or income entries yet. Clients offer "copy a template or start blank".
    MonthTotals:
      type: object
      required:
        - month
        - gross_cents
        - gross_taxable_cents
        - net_cents
        - spent_cents
        - saving_cents
        - left_over_cents
        - has_entries
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        gross_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        gross_taxable_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        net_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        spent_cents: { $ref: '#/components/schemas/Cents' }
        saving_cents: { $ref: '#/components/schemas/Cents' }
        left_over_cents: { $ref: '#/components/schemas/Cents' }
        has_entries: { type: boolean }
    YearlySummary:
      type: object
      required: [year, months, categories, totals, average_month_count]
      properties:
        year: { $ref: '#/components/schemas/Year' }
        months:
          type: array
          minItems: 12
          maxItems: 12
          description: January to December, zero-filled.
          items: { $ref: '#/components/schemas/MonthTotals' }
        categories:
          type: array
          description: Every category, in `sort_order`.
          items:
            type: object
            required: [category_id, name, color, is_saving, is_protected, total_cents, monthly_average_cents]
            properties:
              category_id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              color: { $ref: '#/components/schemas/Color' }
              is_saving: { type: boolean }
              is_protected: { type: boolean }
              total_cents: { $ref: '#/components/schemas/Cents' }
              monthly_average_cents:
                allOf: [{ $ref: '#/components/schemas/Cents' }]
                description: '`total_cents / average_month_count`, rounded half away from zero.'
        totals:
          type: object
          required: [gross_cents, gross_taxable_cents, net_cents, spent_cents, saving_cents, left_over_cents]
          properties:
            gross_cents: { $ref: '#/components/schemas/NonNegativeCents' }
            gross_taxable_cents: { $ref: '#/components/schemas/NonNegativeCents' }
            net_cents: { $ref: '#/components/schemas/NonNegativeCents' }
            spent_cents: { $ref: '#/components/schemas/Cents' }
            saving_cents: { $ref: '#/components/schemas/Cents' }
            left_over_cents: { $ref: '#/components/schemas/Cents' }
        average_month_count:
          type: integer
          minimum: 0
          description: Months in the year with any entries; the divisor for monthly averages (0 means all averages are 0).

    # ---- Trends -------------------------------------------------------------
    CustomTrend:
      type: object
      required: [group_by, buckets]
      properties:
        group_by:
          type: string
          enum: [month, year]
        buckets:
          type: array
          description: Every period in the range, oldest first, zero-filled.
          items:
            type: object
            required: [period, total_cents, count]
            properties:
              period:
                type: string
                description: '`YYYY-MM` when grouped by month, `YYYY` when grouped by year.'
                examples: ['2026-03', '2026']
              total_cents: { $ref: '#/components/schemas/Cents' }
              count: { type: integer, minimum: 0 }
    CategoryTrendSeries:
      type: object
      required: [category_id, name, color, is_saving, this_year_cents, last_year_cents]
      properties:
        category_id:
          type: [string, 'null']
          description: Null for the "all spending" series.
        name: { type: string }
        color: { $ref: '#/components/schemas/Color' }
        is_saving:
          type: boolean
          description: When true, an increase is better (blue) rather than worse (orange).
        this_year_cents:
          type: array
          minItems: 12
          maxItems: 12
          description: Index 0 is January of `year`.
          items: { $ref: '#/components/schemas/Cents' }
        last_year_cents:
          type: array
          minItems: 12
          maxItems: 12
          description: Index 0 is January of `year - 1`. Index 11 is the December used for January's month-over-month.
          items: { $ref: '#/components/schemas/Cents' }
    CategoryTrends:
      type: object
      required: [year, all_spending, categories]
      properties:
        year: { $ref: '#/components/schemas/Year' }
        all_spending:
          $ref: '#/components/schemas/CategoryTrendSeries'
          description: Every category combined, Saving included (for now; see root AGENTS.md).
        categories:
          type: array
          description: Every category, in `sort_order`.
          items: { $ref: '#/components/schemas/CategoryTrendSeries' }

    # ---- Saved trends -------------------------------------------------------
    TrendMatchType:
      type: string
      enum: [merchant, category, note]
    TrendMeasure:
      type: string
      enum: [amount, count]
    SavedTrend:
      type: object
      description: |
        Exactly one of `merchant_id`, `category_id`, `match_text` is set, matching `match_type`.
        Deleting the matched merchant or category deletes the saved trend.
      required: [id, name, match_type, merchant_id, category_id, match_text, measure, sort_order, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        match_type: { $ref: '#/components/schemas/TrendMatchType' }
        merchant_id: { type: [string, 'null'] }
        category_id: { type: [string, 'null'] }
        match_text: { type: [string, 'null'] }
        measure: { $ref: '#/components/schemas/TrendMeasure' }
        sort_order: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    SavedTrendCreate:
      type: object
      description: Send only the field that matches `match_type` (`merchant_id`, `category_id` or `match_text`).
      required: [name, match_type, measure]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        match_type: { $ref: '#/components/schemas/TrendMatchType' }
        merchant_id: { $ref: '#/components/schemas/Id' }
        category_id: { $ref: '#/components/schemas/Id' }
        match_text: { type: string, minLength: 1, maxLength: 200 }
        measure: { $ref: '#/components/schemas/TrendMeasure' }
        sort_order: { type: integer }
    SavedTrendUpdate:
      type: object
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/Name' }
        match_type: { $ref: '#/components/schemas/TrendMatchType' }
        merchant_id: { type: [string, 'null'] }
        category_id: { type: [string, 'null'] }
        match_text: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        measure: { $ref: '#/components/schemas/TrendMeasure' }
        sort_order: { type: integer }

    # ---- Admin --------------------------------------------------------------
    BackupKind:
      type: string
      enum: [weekly, monthly, manual]
    Backup:
      type: object
      required: [id, kind, status, started_at, finished_at, size_bytes, error_message]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/BackupKind' }
        status:
          type: string
          enum: [running, succeeded, failed]
        started_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at:
          type: [string, 'null']
          format: date-time
        size_bytes:
          type: [integer, 'null']
          format: int64
        error_message:
          type: [string, 'null']
          description: Short, safe reason when `status` is failed.
    AdminUser:
      type: object
      required: [id, firebase_uid, email, display_name, role, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        firebase_uid: { type: string }
        email: { type: [string, 'null'] }
        display_name: { type: [string, 'null'] }
        role:
          type: string
          enum: [admin, member]
        created_at: { $ref: '#/components/schemas/Timestamp' }
    NewAdminUser:
      type: object
      required: [firebase_uid]
      properties:
        firebase_uid:
          type: string
          minLength: 1
          maxLength: 128
          description: The uid of the account already created in the Firebase console.
        email: { type: [string, 'null'], maxLength: 254 }
        display_name: { type: [string, 'null'], maxLength: 100 }
        role:
          type: string
          enum: [admin, member]
          default: member
    AdminStatus:
      type: object
      required: [version, started_at, uptime_seconds, database, backups, auth_provider]
      properties:
        version: { type: string }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        uptime_seconds: { type: integer, minimum: 0 }
        database:
          type: object
          required: [size_bytes, last_write_at]
          properties:
            size_bytes: { type: integer, format: int64, minimum: 0 }
            last_write_at:
              type: [string, 'null']
              format: date-time
              description: Latest `updated_at` across user data.
        backups:
          type: object
          required: [schedule, retention, last_run, next_weekly_at, next_monthly_at]
          properties:
            schedule:
              type: string
              description: Human-readable, e.g. "Weekly on Sundays, monthly on the 1st".
            retention:
              type: object
              required: [weekly, monthly]
              properties:
                weekly: { type: integer, examples: [8] }
                monthly: { type: integer, examples: [12] }
            last_run:
              oneOf:
                - $ref: '#/components/schemas/Backup'
                - type: 'null'
            next_weekly_at: { type: string, format: date-time }
            next_monthly_at: { type: string, format: date-time }
        auth_provider:
          type: object
          required: [status, checked_at]
          properties:
            status:
              type: string
              enum: [ok, unreachable]
            checked_at: { type: string, format: date-time }
