# The M1 smoke stack for the end-to-end suite: the same API and web images and
# Caddyfile as the root docker-compose.yml (dev profile). Tests sign in with real
# usernames and passwords made with the API's `user add` CLI. Run it through
# `npm test` in this folder, which starts it as project "pp-e2e" on its own port
# and volume.
name: pp-e2e

# The same lockdown as the root docker-compose.yml (#109), so e2e runs the stack
# as it is deployed.
x-hardening: &hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  read_only: true

services:
  api:
    <<: *hardening
    build: ../backend
    volumes:
      - api-data:/data
    tmpfs:
      - /tmp
    mem_limit: 768m
    pids_limit: 256
    environment:
      PORT: "8080"
      DB_PATH: /data/spend.db
      # Every test reaches the API from this one Docker network address, one
      # after another for minutes, so the per-IP and per-user limits are raised
      # (#106). The expensive-route limit keeps its production value and is
      # what request-limits.spec.ts checks; backend tests cover the rest.
      RATE_LIMIT_PER_IP: "500/1000"
      RATE_LIMIT_PER_USER: "500/1000"
      # Tests sign in as the same few users again and again. The lock-out after
      # 10 failures in a row keeps its production value (auth.spec.ts checks it).
      RATE_LIMIT_LOGIN: "500/1000"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    <<: *hardening
    build: ../web
    tmpfs:
      - /config:uid=10001,gid=10001,mode=0700
      - /data:uid=10001,gid=10001,mode=0700
    mem_limit: 128m
    pids_limit: 128
    expose:
      - "8080"

  proxy:
    <<: *hardening
    image: caddy:2.11@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    cap_add:
      - NET_BIND_SERVICE
    # No certificate volume here: the internal CA is recreated with the stack.
    tmpfs:
      - /config
      - /data
    mem_limit: 256m
    pids_limit: 256
    environment:
      DOMAIN: localhost
    ports:
      - "18443:443"
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../deploy/no-certs:/certs:ro # no tailnet certificate: Caddy's internal CA signs localhost
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  # Test-only and never started by `up`: `docker compose run dbtool node -e …`
  # edits the API's database with Node's built-in SQLite, for the one thing no
  # route can do (ageing a session past its 30 days; support/stack.ts ageSession).
  dbtool:
    <<: *hardening
    profiles: ["tools"]
    image: node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    user: "65532:65532" # the API image's nonroot user, which owns the database
    network_mode: none
    volumes:
      - api-data:/data

volumes:
  api-data:
