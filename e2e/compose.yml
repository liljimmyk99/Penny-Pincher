# The M1 smoke stack for the end-to-end suite: the same API and web images and
# Caddyfile as the root docker-compose.yml (dev profile), with the Firebase Auth
# emulator in place of real Firebase. Run it through `npm test` in this folder,
# which starts it as project "pp-e2e" on its own ports and volume.
name: pp-e2e

# The same lockdown as the root docker-compose.yml (#109), so e2e runs the stack
# as it is deployed.
x-hardening: &hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  read_only: true

services:
  auth:
    build: ./auth-emulator
    # Test-only: no privileges or capabilities, but a writable filesystem
    # (firebase-tools writes its cache and config under the home directory).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    ports:
      - "19099:9099" # the browser signs in here (baked into the web build below)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9099/"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    <<: *hardening
    build: ../backend
    volumes:
      - api-data:/data
    tmpfs:
      - /tmp
    mem_limit: 768m
    pids_limit: 256
    environment:
      PORT: "8080"
      DB_PATH: /data/spend.db
      # demo- projects are emulator-only; the API refuses the emulator otherwise.
      FIREBASE_PROJECT_ID: demo-penny-pincher
      FIREBASE_AUTH_EMULATOR_HOST: auth:9099
      # Every test reaches the API from this one Docker network address, one
      # after another for minutes, so the per-IP and per-user limits are raised
      # (#106). The expensive-route limit keeps its production value and is
      # what request-limits.spec.ts checks; backend tests cover the rest.
      RATE_LIMIT_PER_IP: "500/1000"
      RATE_LIMIT_PER_USER: "500/1000"
    expose:
      - "8080"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    <<: *hardening
    build:
      context: ../web
      args:
        VITE_FIREBASE_API_KEY: demo-api-key
        VITE_FIREBASE_PROJECT_ID: demo-penny-pincher
        VITE_FIREBASE_AUTH_EMULATOR_URL: http://localhost:19099
    tmpfs:
      - /config:uid=10001,gid=10001,mode=0700
      - /data:uid=10001,gid=10001,mode=0700
    mem_limit: 128m
    pids_limit: 128
    expose:
      - "8080"

  proxy:
    <<: *hardening
    image: caddy:2.11@sha256:9c1b76fb701c1f77383d3124d9f626e38bcf83bc1255ed47475d4f2420701d03
    cap_add:
      - NET_BIND_SERVICE
    # No certificate volume here: the internal CA is recreated with the stack.
    tmpfs:
      - /config
      - /data
    mem_limit: 256m
    pids_limit: 256
    environment:
      DOMAIN: localhost
      # The web build's default auth domain (no VITE_FIREBASE_AUTH_DOMAIN above).
      FIREBASE_AUTH_DOMAIN: demo-penny-pincher.firebaseapp.com
      # Lets the Content-Security-Policy reach the emulator (sign-in requests and
      # the popup's iframe). Only this stack sets it; see deploy/Caddyfile.
      FIREBASE_AUTH_EMULATOR_URL: http://localhost:19099
    ports:
      - "18443:443"
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  api-data:
