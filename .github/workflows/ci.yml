# Checks every pull request (and every push to master) so later work stays green.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (vet, test, generated code)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Generated Go code matches the spec
        run: |
          make check-generate
          # git diff misses new untracked files, so check those too.
          test -z "$(git status --porcelain -- internal/api)" || { git status --porcelain -- internal/api; exit 1; }

  web:
    name: Web (lint, typecheck, test, generated types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # matches web/Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Generated TypeScript types match the spec
        run: |
          npm run check:api
          test -z "$(git status --porcelain -- src/api)" || { git status --porcelain -- src/api; exit 1; }

  api:
    name: API spec (Redocly lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # recommended-strict (redocly.yaml) makes warnings fail as well as errors.
      - name: Redocly lint
        run: npx --yes @redocly/cli@2.75.0 lint

  e2e:
    name: End-to-end (M1 smoke gate on the Docker stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Builds and starts e2e/compose.yml (API, web, Caddy, Firebase Auth emulator), runs every spec, tears it down.
      - name: Playwright
        run: npm test
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # Known vulnerabilities in our dependencies and images (#107, docs/security.md "Patching").
  security:
    name: Security (govulncheck, npm audit, image scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Fails only on vulnerabilities our code actually reaches (symbol-level).
      - name: govulncheck (backend)
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Reads the lockfile only; dev tools never ship, so only runtime dependencies count.
      - name: npm audit (web, runtime dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - uses: docker/setup-buildx-action@v3
      # Same build as the docker job (shared cache), loaded locally so Trivy can scan it.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: penny-pincher-backend:ci
          cache-from: type=gha,scope=backend
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: penny-pincher-web:ci
          cache-from: type=gha,scope=web
      # Third-party action, so pinned by commit rather than a movable tag; Dependabot bumps the SHA.
      # Fails on HIGH/CRITICAL findings that have a fix available. Accepted ones, each with
      # an expiry date, are in .trivyignore.yaml.
      - name: Trivy (backend image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: penny-pincher-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      - name: Trivy (web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: penny-pincher-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Build only; nothing is pushed. The web build gets no Firebase config here,
      # which is fine because it is only baked into the bundle, not checked.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
