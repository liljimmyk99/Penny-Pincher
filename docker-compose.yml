# Whole-app stack. Pick a profile via COMPOSE_PROFILES in .env (see .env.example):
#   dev  - localhost, Caddy's internal CA, ports 8080/8443
#   prod - real DOMAIN, automatic Let's Encrypt, ports 80/443
#
# Every container is locked down (docs/security.md, #109): no privilege
# escalation, no Linux capabilities (the proxy gets back only the one to bind
# 80/443), a read-only root filesystem with tmpfs or volumes only where it must
# write, and memory and process limits. Only the proxy publishes ports.
x-hardening: &hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  read_only: true

# Logs rotate (#110): Docker's json-file driver keeps at most 5 files of 10 MB
# per container, so logs can't fill the disk. They live under Docker's
# data-root, on the encrypted volume (docs/encryption.md).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    <<: *hardening
    logging: *logging
    build: ./backend
    # Includes the /tmp tmpfs, which holds a full plaintext copy of the database
    # during a backup. Raise it if the database ever grows past ~200 MB.
    mem_limit: 768m
    pids_limit: 256
    volumes:
      - api-data:/data # SQLite file lives here (DB_PATH=/data/spend.db)
      - ./secrets/firebase-sa.json:/run/secrets/firebase-sa.json:ro
    # Memory-only /tmp: backups write a plaintext VACUUM INTO copy here before
    # encrypting it, and it must never touch disk (docs/encryption.md).
    tmpfs:
      - /tmp
    environment:
      PORT: "8080"
      DB_PATH: ${DB_PATH:-/data/spend.db}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-sa.json
      # Encrypted off-server backups (docs/backups.md). Unset = disabled.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    <<: *hardening
    logging: *logging
    build:
      context: ./web
      args:
        # Public Firebase web config for the browser SDK, baked in at build time.
        VITE_FIREBASE_API_KEY: ${FIREBASE_WEB_API_KEY:?set FIREBASE_WEB_API_KEY in .env}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env}
        VITE_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
    # Caddy as the image's non-root user (uid 10001), on :8080. It keeps nothing,
    # so its config and data dirs are memory-only.
    tmpfs:
      - /config:uid=10001,gid=10001,mode=0700
      - /data:uid=10001,gid=10001,mode=0700
    mem_limit: 128m
    pids_limit: 128
    expose:
      - "8080"
    restart: unless-stopped

  proxy-dev:
    profiles: ["dev"]
    <<: *hardening
    logging: *logging
    cap_add:
      - NET_BIND_SERVICE # binds 80 and 443 inside the container
    tmpfs:
      - /config # Caddy's autosaved config; certificates live in /data
    mem_limit: 256m
    pids_limit: 256
    image: caddy:2.11
    environment:
      DOMAIN: localhost
      # The Content-Security-Policy allows the Firebase auth domain's iframe.
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-${FIREBASE_PROJECT_ID}.firebaseapp.com}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dev-data:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  proxy:
    profiles: ["prod"]
    <<: *hardening
    logging: *logging
    cap_add:
      - NET_BIND_SERVICE # binds 80 and 443 inside the container
    tmpfs:
      - /config # Caddy's autosaved config; certificates live in /data
    mem_limit: 256m
    pids_limit: 256
    image: caddy:2.11
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-${FIREBASE_PROJECT_ID}.firebaseapp.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # keeps certificates across restarts
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  api-data:
  caddy-data:
  caddy-dev-data:
