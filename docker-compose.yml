# Whole-app stack. Pick a profile via COMPOSE_PROFILES in .env (see .env.example):
#   dev  - localhost, Caddy's internal CA, ports 8080/8443
#   prod - real DOMAIN, automatic Let's Encrypt, ports 80/443
services:
  api:
    build: ./backend
    volumes:
      - api-data:/data # SQLite file lives here (DB_PATH=/data/spend.db)
      - ./secrets/firebase-sa.json:/run/secrets/firebase-sa.json:ro
    # Memory-only /tmp: backups write a plaintext VACUUM INTO copy here before
    # encrypting it, and it must never touch disk (docs/encryption.md).
    tmpfs:
      - /tmp
    environment:
      PORT: "8080"
      DB_PATH: ${DB_PATH:-/data/spend.db}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-sa.json
      # Encrypted off-server backups (docs/backups.md). Unset = disabled.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Public Firebase web config for the browser SDK, baked in at build time.
        VITE_FIREBASE_API_KEY: ${FIREBASE_WEB_API_KEY:?set FIREBASE_WEB_API_KEY in .env}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env}
        VITE_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
    expose:
      - "80"
    restart: unless-stopped

  proxy-dev:
    profiles: ["dev"]
    image: caddy:2
    environment:
      DOMAIN: localhost
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dev-data:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  proxy:
    profiles: ["prod"]
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # keeps certificates across restarts
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  api-data:
  caddy-data:
  caddy-dev-data:
